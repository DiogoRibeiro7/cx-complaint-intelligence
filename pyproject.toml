[tool.poetry]
name = "cx-complaint-intelligence"
version = "0.1.0"
description = "Customer Experience complaint intelligence platform using CFPB consumer complaint data."
authors = ["Diogo Ribeiro <hansolo.dj@gmail.com>"]
readme = "README.md"
packages = [{ include = "cx_complaints", from = "src" }]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = ">=2.2.0,<3.0.0"
numpy = ">=1.26.0,<3.0.0"
requests = ">=2.31.0,<3.0.0"
# Pin the requests transitive deps explicitly so poetry's resolver locks
# them inside the compatibility ranges requests checks for at import time.
# Without these pins, an upstream urllib3 / charset-normalizer bump could
# trigger a RequestsDependencyWarning at startup.
urllib3 = ">=1.21.1,<3.0.0"
charset-normalizer = ">=2.0.0,<4.0.0"
scikit-learn = ">=1.4.0,<2.0.0"
scipy = ">=1.11.0,<2.0.0"
click = ">=8.1.7,<9.0.0"
rich = ">=13.7.0,<14.0.0"
pydantic = ">=2.6.0,<3.0.0"
python-dateutil = ">=2.9.0,<3.0.0"
tabulate = ">=0.9.0,<1.0.0"
matplotlib = ">=3.8.0,<4.0.0"
duckdb = ">=1.0.0,<2.0.0"
streamlit = { version = ">=1.36,<2.0", optional = true }
sentence-transformers = { version = ">=2.7,<7.0", optional = true }
torch = { version = ">=2.4,<2.7", optional = true }

[tool.poetry.extras]
embeddings = ["sentence-transformers", "torch"]
dashboard = ["streamlit"]
all = ["sentence-transformers", "torch", "streamlit"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-cov = ">=5.0.0,<6.0.0"
ruff = ">=0.4.0,<1.0.0"
mypy = ">=1.10.0,<2.0.0"
types-requests = ">=2.31.0,<3.0.0"
nbformat = ">=5.10.0,<6.0.0"
nbconvert = ">=7.16.0,<8.0.0"
ipykernel = ">=6.29.0,<8.0.0"
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocs-jupyter = ">=0.25,<1.0"
# Heavy deps that the tests need. Production users install them via extras
# (`poetry install --extras embeddings` and/or `--extras dashboard`).
streamlit = ">=1.36,<2.0"
sentence-transformers = ">=2.7,<7.0"
torch = ">=2.4,<2.7"

[tool.poetry.scripts]
cx-complaints = "cx_complaints.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "C4", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=cx_complaints --cov-report=term-missing"
testpaths = ["tests"]
# Treat the warnings that signal environment drift / silent data bugs as
# hard failures.  Other warnings stay at "default" so upstream deprecations
# do not break CI when we cannot fix the upstream.
filterwarnings = [
    "error::requests.exceptions.RequestsDependencyWarning",
    "error:Converting to PeriodArray/Index representation will drop timezone information:UserWarning",
    "error:Could not infer format:UserWarning",
]
